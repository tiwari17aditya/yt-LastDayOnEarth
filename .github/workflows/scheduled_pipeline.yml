name: Scheduled Last Day on Earth Video Pipeline

on:
  # Scheduled Google Drive polling aligned with creator release rhythm
  schedule:
    # Weekdays: 2 times a day (3:00 PM IST [09:30 UTC] & 7:00 PM IST [13:30 UTC])
    - cron: '30 9,13 * * 1-5'
    # Weekends: 4 times a day (11:00 AM [05:30 UTC], 2:00 PM [08:30 UTC], 5:00 PM [11:30 UTC], 8:00 PM [14:30 UTC] IST)
    - cron: '30 5,8,11,14 * * 6,0'

  # Allow manual trigger anytime via GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (Inspect Google Drive without downloading or processing)'
        required: false
        type: boolean
        default: false
      upload:
        description: 'Upload processed video to YouTube'
        required: false
        type: boolean
        default: true
      limit:
        description: 'Maximum videos to process in this run'
        required: false
        type: number
  # Prevent concurrent execution: jobs never overlap, and in-progress processing is strictly preserved
concurrency:
  group: ldoe-video-processing-pipeline
  cancel-in-progress: false

jobs:
  check-and-process:
    name: Check Drive & Process Video
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure CC0 Soundtrack Library is Present
        run: |
          python -c "from pathlib import Path; files = list(Path('config/audio').glob('*.mp3')); assert len(files) >= 5, f'Found {len(files)} files'" || python scripts/generate_safe_ambient_theme.py

      - name: Sync Static Video & Audio Assets from Google Drive
        env:
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GDRIVE_PARENT_FOLDER_NAME: "youtube-projects"
          GDRIVE_PROJECT_FOLDER_NAME: "LastDayOnEarth"
          GDRIVE_ASSETS_FOLDER_NAME: "Assets"
        run: |
          python -m src.main sync-assets --download || echo "Asset sync warning: will use local bundled assets if available"

      - name: Run Pipeline Scheduled Task
        env:
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER || 'addytiwari3@gmail.com' }}
          NOTIFICATION_RECIPIENTS: ${{ secrets.NOTIFICATION_RECIPIENTS || 'addytiwari3@gmail.com' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_PARENT_FOLDER_NAME: "youtube-projects"
          GDRIVE_PROJECT_FOLDER_NAME: "LastDayOnEarth"
          GDRIVE_INPUT_FOLDER_NAME: "Input"
          GDRIVE_PROCESSED_FOLDER_NAME: "Processed"
          GDRIVE_ASSETS_FOLDER_NAME: "Assets"
          YOUTUBE_PRIVACY_STATUS: "private"
          YOUTUBE_SCHEDULED_PUBLISH: "true"
          VIDEO_PRESET: "veryfast"
          ENVIRONMENT: "production"
          LOG_LEVEL: "INFO"
          ENABLE_VOICE_COMMENTARY: "true"
          COMMENTARY_PERSONA: "casual"
          COMMENTARY_VOICE: "en-US-GuyNeural"
          COMMENTARY_VOLUME_BOOST_DB: "+1dB"
          COMMENTARY_RATE: "-3%"
          COMMENTARY_PITCH: "-2Hz"
          COMMENTARY_INCLUDE_BGM: "true"
          COMMENTARY_BGM_VOLUME_DB: "-22dB"
          COMMENTARY_DUCKING_RATIO: "3.5"
          COMMENTARY_MIN_CUE_INTERVAL: "25.0"
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-upload"
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ] || [ "$LIMIT" = "null" ]; then
            # Balanced release cadence & storage clearance: 2 videos on weekday runs (2 runs = 4/day),
            # 1 video on weekend runs (4 runs = 4/day), strictly within 10,000 daily YouTube API quota.
            DOW=$(date +%u)
            if [ "$DOW" -le 5 ]; then
              LIMIT="2"
            else
              LIMIT="1"
            fi
          else
            # Strip decimal fraction if passed as float by GitHub Actions (e.g. '3.0' -> '3')
            LIMIT="${LIMIT%.*}"
          fi
          EXTRA_ARGS="$EXTRA_ARGS --limit $LIMIT"

          echo "Executing: python -m src.main drive-cron $EXTRA_ARGS"
          python -m src.main drive-cron $EXTRA_ARGS

      - name: Persist Series Tracker & History Changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/series_tracker.json data/publishing_queue.json data/history.json data/thumbnails/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist series tracker & history updates [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD || true
          fi
